[package]
name = "oxide-forge"
version = "0.1.0"
edition = "2024"
description = "A purpose-built Rust/CUDA neural network runtime powered by CUDA-Oxide"

[workspace]

[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git" }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git" }
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git" }
rand = "0.10.2"
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
